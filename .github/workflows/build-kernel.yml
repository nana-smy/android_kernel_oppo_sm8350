name: Build OPPO SM8350 Kernel

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: "内核/vendor 分支"
        type: choice
        required: true
        default: "oppo/sm8350_u_14.0.0_find_x3_pro"
        options:
          - "oppo/sm8350_u_14.0.0_find_x3_pro"
          - "oppo/sm8350_u_14.0.0_find_x3_pro_lensman"
          - "oppo/sm8350_u_14.0.0_find_x5"
          - "oppo/sm8350_u_14.0.0_find_n"
          - "oppo/sm8350_u_14.0_k10_pro_5g"
          - "oppo/sm8350_v_15.0.0_find_x5"
          - "oppo/sm8350_t_13.0.0_find_x3_pro"
          - "oppo/sm8350_t_13.0.0_k10_pro"
          - "oppo/sm8350_s_13.0.0_find_x5"
          - "oppo/sm8350_s_13.0.0_find_n"
          - "oppo/sm8350_s_12.1_find_x3_pro"
          - "oppo/sm8350_s_12.1_oppo_k10_pro_5g"
          - "oppo/sm8350_s_12.1_oppo_luwu"

      resukisu:
        description: "集成 ReSukiSU (KernelSU 分支)"
        type: boolean
        default: true

      resukisu_ref:
        description: "ReSukiSU 版本/分支"
        type: choice
        default: "v4.2.0-rc3"
        options:
          - "v4.2.0-rc3"
          - "main"
          - "v4.1.0"

      susfs:
        description: "集成 SUSFS (susfs4ksu kernel-5.4)"
        type: boolean
        default: true

      susfs_ref:
        description: "susfs4ksu 分支"
        type: choice
        default: "kernel-5.4"
        options:
          - "kernel-5.4"
          - "master"

      clang_version:
        description: "AOSP prebuilt clang"
        type: choice
        default: "clang-r383902b"
        options:
          - "clang-r383902b"   # android12-release, clang 12，5.4 内核已验证
          - "clang-r416183b"   # android13-release, clang 14
          - "clang-r487747c"   # android14-release, 较新，5.4 可能有新告警

      lto:
        description: "保留 LTO/CFI/SCS（需大内存，默认关闭）"
        type: boolean
        default: false

      build_modules:
        description: "编译 .ko 模块（手动触发默认开，push 触发默认关）"
        type: boolean
        default: true

      ak3_devices:
        description: "AnyKernel3 设备代号（如 peux），留空则不打 AK3"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}-${{ inputs.kernel_branch || 'auto' }}
  cancel-in-progress: false

jobs:
  build:
    name: "Build ${{ inputs.kernel_branch || 'auto' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      KERNEL_BRANCH: ${{ inputs.kernel_branch }}
      ENABLE_RESUKISU: ${{ inputs.resukisu }}
      RESUKISU_REF: ${{ inputs.resukisu_ref }}
      ENABLE_SUSFS: ${{ inputs.susfs }}
      SUSFS_REF: ${{ inputs.susfs_ref }}
      CLANG_VERSION: ${{ inputs.clang_version }}
      LTO: ${{ inputs.lto }}
      BUILD_MODULES: ${{ inputs.build_modules || 'false' }}
      AK3_DEVICES: ${{ inputs.ak3_devices }}

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            bc bison flex libssl-dev libelf-dev cpio kmod dwarves lz4 zstd \
            device-tree-compiler xxd jq ccache zip unzip \
            binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu

      - name: Configure ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ inputs.kernel_branch || 'u14' }}-${{ inputs.clang_version || 'r383902b' }}-${{ inputs.resukisu }}-${{ inputs.susfs }}
          max-size: 2G

      - name: Build kernel
        env:
          JOBS: "4"
          WORK: ${{ github.workspace }}/tree
          ARTIFACTS: ${{ github.workspace }}/artifacts
        run: |
          set -o pipefail
          bash scripts/build.sh 2>&1 | tee build.log

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ replace(inputs.kernel_branch || 'auto', '/', '-') }}-${{ inputs.resukisu == false && 'plain' || 'ksu' }}-${{ inputs.susfs == false && 'nosusfs' || 'susfs' }}
          path: |
            artifacts/
            build.log
          if-no-files-found: warn
          retention-days: 14

      # 把编译日志回传到 ci-logs 分支，便于运维/助手直接读取失败原因
      - name: Publish build log to ci-logs branch
        if: always()
        run: |
          set -e
          BRANCH="ci-logs"
          TMP=$(mktemp -d)
          mkdir -p "$TMP"
          cp build.log "$TMP/build-${{ github.run_id }}.log" 2>/dev/null || true
          cp /tmp/olddef.log "$TMP/olddefconfig-${{ github.run_id }}.log" 2>/dev/null || true
          cp /tmp/susfs.log "$TMP/susfs-patch-${{ github.run_id }}.log" 2>/dev/null || true
          cd "$TMP"
          git init -q -b "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "ci logs: run ${{ github.run_id }} (${{ job.status }})" || true
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$BRANCH"
